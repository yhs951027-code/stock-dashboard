<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F4C5C">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>오늘의 주식 분석</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 한 손으로 내려 읽는 1열 카드. 위에서부터 시장 선택 → 분위기 → 기간 → TOP 5 → 검색/관심종목. */
:root{
  --bg:#EDF0F3; --card:#FFFFFF; --ink:#152033; --sub:#4E5B6E; --line:#D3DAE2;
  --brand:#0F4C5C; --brand-ink:#FFFFFF; --soft:#E1ECEE;
  --up:#C4122F; --down:#1B4FC4; --flat:#4E5B6E;
  --good:#16794A; --good-bg:#E3F3EA; --mid:#8A5A00; --mid-bg:#FBF0D6; --warn:#B3261E; --warn-bg:#FBE6E4;
  --star:#C98A00; --shadow:0 1px 2px rgba(21,32,51,.08),0 6px 18px rgba(21,32,51,.06);
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10161F; --card:#1A2330; --ink:#EEF2F6; --sub:#A9B4C2; --line:#33404F;
  --brand:#7FD1DE; --brand-ink:#0B1A20; --soft:#22323A;
  --up:#FF7A8C; --down:#7FA8FF; --flat:#A9B4C2;
  --good:#6FD6A0; --good-bg:#17352A; --mid:#F2C562; --mid-bg:#3A2F14; --warn:#FF9A91; --warn-bg:#3F1E1C;
  --star:#F2C562; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#10161F; --card:#1A2330; --ink:#EEF2F6; --sub:#A9B4C2; --line:#33404F;
  --brand:#7FD1DE; --brand-ink:#0B1A20; --soft:#22323A;
  --up:#FF7A8C; --down:#7FA8FF; --flat:#A9B4C2;
  --good:#6FD6A0; --good-bg:#17352A; --mid:#F2C562; --mid-bg:#3A2F14; --warn:#FF9A91; --warn-bg:#3F1E1C;
  --star:#F2C562; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
a{color:var(--brand)}
h1,h2,h3,p{margin:0}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:18px;min-height:100dvh}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.sub{color:var(--sub)}
.small{font-size:16px}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.top h1{font-family:var(--f-num);font-size:26px;font-weight:700;letter-spacing:-.01em}
.upd{font-size:16px;color:var(--sub)}
.btn{min-height:52px;padding:10px 18px;border-radius:12px;border:2px solid var(--brand);background:var(--card);color:var(--brand);font-weight:700;font-size:18px}
.btn.fill{background:var(--brand);color:var(--brand-ink)}
.btn.wide{width:100%}
.btn.ghost{border-color:var(--line);color:var(--ink);font-weight:500}

.banner{border-radius:12px;padding:12px 14px;background:var(--mid-bg);color:var(--mid);font-weight:500;border:1px solid var(--mid)}
.banner.err{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}

.tabs{display:grid;gap:8px}
.tabs.two{grid-template-columns:1fr 1fr}
.tabs.three{grid-template-columns:repeat(3,1fr)}
.tab{min-height:60px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:20px;font-weight:700;color:var(--sub)}
.tab[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tabs.three .tab{min-height:54px;font-size:19px}

.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.sec-title{font-family:var(--f-num);font-size:21px;font-weight:700}

.mood-pill{display:inline-flex;align-items:center;gap:8px;font-size:24px;font-weight:700;padding:6px 14px;border-radius:999px}
.mood-pill.good{background:var(--good-bg);color:var(--good)}
.mood-pill.mid{background:var(--mid-bg);color:var(--mid)}
.mood-pill.warn{background:var(--warn-bg);color:var(--warn)}
.tag{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:16px;padding:3px 10px;border-radius:999px;white-space:nowrap}
.tag.good{background:var(--good-bg);color:var(--good)} .tag.mid{background:var(--mid-bg);color:var(--mid)} .tag.warn{background:var(--warn-bg);color:var(--warn)}
.sig{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start;padding-block:10px;border-top:1px solid var(--line)}
.sig p{grid-column:1/-1;color:var(--sub);font-size:16px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-size:17px;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--soft);font-weight:700}
.switch{display:flex;align-items:center;gap:10px;min-height:48px;font-size:17px}
.switch input{width:26px;height:26px;accent-color:var(--brand)}

.stock{gap:12px}
.rank{font-family:var(--f-num);font-weight:700;font-size:18px;color:var(--brand)}
.s-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.s-name{font-size:24px;font-weight:700;line-height:1.3;min-width:0}
.s-code{font-size:15px;color:var(--sub);font-weight:400}
.score-box{flex:none;text-align:right;line-height:1.15}
.score-box .n{font-family:var(--f-num);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
.score-box .l{font-size:15px;color:var(--sub)}
.price{font-family:var(--f-num);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.chg{font-family:var(--f-num);font-weight:600;font-size:19px;font-variant-numeric:tabular-nums}
.chg.up{color:var(--up)} .chg.down{color:var(--down)} .chg.flat{color:var(--flat)}
.stars{color:var(--star);font-size:22px;letter-spacing:2px;white-space:nowrap}
.stars .off{color:var(--line)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}

.list-btn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:60px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);text-align:left}
.list-btn b{font-size:19px}
.search{width:100%;min-height:56px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:19px;padding:10px 14px}

.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;display:flex;gap:8px;justify-content:space-between;max-width:640px;margin:0 auto}
.sheet-body{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:14px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.big-score{font-family:var(--f-num);font-size:44px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
ol.why{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
ol.why li{display:grid;grid-template-columns:34px 1fr;gap:8px}
ol.why .no{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--brand);font-weight:700;display:grid;place-items:center;font-size:17px}
ul.pts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.pts li{display:grid;grid-template-columns:28px 1fr;gap:6px}
.ok{color:var(--good);font-weight:700} .no-ok{color:var(--warn);font-weight:700}
table.bd{width:100%;border-collapse:collapse;font-size:17px}
table.bd td{padding:9px 4px;border-top:1px solid var(--line);vertical-align:top}
table.bd td:last-child{text-align:right;white-space:nowrap;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600}
table.bd tr.sum td{font-weight:700;border-top:2px solid var(--ink);font-size:19px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--brand)}
.hz{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.hz p{grid-column:1/-1;color:var(--sub);font-size:16px}
.lens{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lens > div{border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.lens .n{font-family:var(--f-num);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding-block:10px;border-top:1px solid var(--line)}
.kv .v{font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums;font-size:19px}
.kv p{grid-column:1/-1;color:var(--sub);font-size:15.5px;line-height:1.5}
.news{display:flex;flex-direction:column;gap:2px;padding-block:10px;border-top:1px solid var(--line)}
.news a{font-weight:500;text-decoration:underline;text-underline-offset:3px}
.foot{font-size:14.5px;color:var(--sub);line-height:1.65;display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;max-width:608px;margin:0 auto;background:var(--ink);color:var(--bg);padding:14px 16px;border-radius:12px;font-weight:500;text-align:center}
@media (min-width:560px){ .s-name{font-size:26px} }
@media (prefers-reduced-motion:no-preference){ .bar i{transition:width .3s} }
</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="top">
    <h1>오늘의 주식 분석</h1>
    <button class="btn" id="btnRefresh" type="button">새로고침</button>
    <div class="upd" id="upd" style="flex-basis:100%">데이터를 불러오는 중입니다…</div>
    <div class="row" style="flex-basis:100%" role="group" aria-label="글씨 크기"><span class="small sub">글씨 크기</span>
      <button class="chip" type="button" data-fs="1">보통</button><button class="chip" type="button" data-fs="1.15">크게</button><button class="chip" type="button" data-fs="1.3">아주 크게</button></div>
  </header>
  <div id="banners"></div>
  <div class="tabs two" role="tablist" aria-label="시장 선택">
    <button class="tab" role="tab" data-market="kr" type="button">🇰🇷 한국주식</button>
    <button class="tab" role="tab" data-market="us" type="button">🇺🇸 미국주식</button>
  </div>
  <section class="card" id="mood"></section>
  <div class="tabs three" role="tablist" aria-label="기간 선택">
    <button class="tab" role="tab" data-hz="short" type="button">단기</button>
    <button class="tab" role="tab" data-hz="mid" type="button">중기</button>
    <button class="tab" role="tab" data-hz="long" type="button">장기</button>
  </div>
  <section id="filter" class="card"></section>
  <section id="top5" style="display:flex;flex-direction:column;gap:14px"></section>
  <section class="card" id="searchBox">
    <h2 class="sec-title">🔍 종목 검색</h2>
    <input class="search" id="q" type="search" inputmode="search" autocomplete="off" placeholder="예: 삼성전자, 엔비디아, AAPL" aria-label="종목 검색">
    <div id="qres" style="display:flex;flex-direction:column;gap:8px"></div>
  </section>
  <section class="card" id="watch"></section>
  <section class="card" id="algo"></section>
  <footer class="foot" id="foot"></footer>
</div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="종목 상세 분석"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script id="engine">
/* ===================== 설정값 (여기 숫자만 바꾸면 알고리즘이 바뀝니다) ===================== */
const CONFIG = {
  /* 기간별 가중치. 각 줄의 합은 반드시 100. */
  WEIGHTS: {
    short: { momentum:40, market:20, volume:10, outlook:10, growth:10, value:10 },
    mid:   { growth:25, value:20, momentum:15, outlook:15, profit:10, market:10, health:5 },
    long:  { profit:20, growth:20, health:15, value:15, cash:10, outlook:10, payout:5, market:5 }
  },
  /* 관점(렌즈)별 가중치 */
  LENS: {
    value:    { value:35, profit:25, health:20, cash:20 },
    growth:   { growth:55, outlook:25, profit:20 },
    dividend: { divyield:60, paysafe:20, cash:20 },
    stable:   { health:40, lowvol:30, profit:30 }
  },
  MIN_COVERAGE: 70,      /* 가중치 기준 이만큼(%) 데이터가 없으면 순위에서 제외 */
  STALE_HOURS: 80,       /* 마지막 갱신 후 이 시간이 지나면 '최신 아님' 경고 */
  NEWS_MAX: 3,
  TOP_N: 10,            /* 순위에 보여줄 종목 수 */
  PRICE_BANDS: {
    kr: [["all","전체",0,Infinity],["b1","1만원 이하",0,10000],["b2","1만~3만원",10000,30000],["b3","3만~5만원",30000,50000],["b4","5만~10만원",50000,100000],["b5","10만원 이상",100000,Infinity]],
    us: [["all","전체",0,Infinity],["b1","20달러 이하",0,20],["b2","20~50달러",20,50],["b3","50~100달러",50,100],["b4","100~300달러",100,300],["b5","300달러 이상",300,Infinity]]
  },
  /* 지표를 0~1점으로 바꾸는 기준 [0점 기준, 만점 기준] */
  RANGE: {
    roe:[0,25], opMargin:[0,30], revGrowth:[-5,30], epsGrowth:[-10,40],
    debtEquity:[2,0], currentRatio:[0.5,2], pe:[40,8], fpe:[35,8], pb:[10,0.5],
    fcfMargin:[0,25], shareholderYield:[0,6], upside:[-10,40],
    vsMa50:[-10,10], vsMa200:[-15,20], rsi:[30,60], chg52w:[-20,50], volRatio:[0.5,1.5],
    divYield:[0,5], payout:[110,60], beta:[2,0.5]
  }
};

const FACTOR_NAME = { profit:"수익성", growth:"성장성", health:"재무건전성", value:"가격 수준(밸류에이션)", cash:"현금흐름",
  payout:"배당·주주환원", outlook:"증권가 전망", momentum:"주가 흐름(모멘텀)", volume:"거래량", market:"시장 환경",
  divyield:"배당수익률", paysafe:"배당 여력", lowvol:"주가 안정성" };
const HZ_NAME = { short:"단기", mid:"중기", long:"장기" };
const HZ_DESC = { short:"약 1주~3개월. 최근 주가 흐름과 거래량, 시장 분위기를 크게 봅니다.",
  mid:"약 3개월~1년. 실적 성장과 가격 수준을 크게 봅니다.",
  long:"1년 이상. 회사가 돈을 잘 버는지, 재무가 튼튼한지를 크게 봅니다." };

const isNum = v => typeof v === "number" && isFinite(v);
function lin(x, range){ if(!isNum(x)) return null; const [lo,hi]=range; const t=(x-lo)/(hi-lo); return Math.max(0,Math.min(1,t)); }
function avg(list){ const a=list.filter(v=>v!==null); return a.length? a.reduce((p,c)=>p+c,0)/a.length : null; }
const R = CONFIG.RANGE;

/* 각 요소의 0~1 점수. 데이터가 하나도 없으면 null(=계산 불가). */
const FACTOR_CALC = {
  profit: s => avg([lin(s.roe,R.roe), lin(s.opMargin,R.opMargin)]),
  growth: s => avg([lin(s.revGrowth,R.revGrowth), lin(s.epsGrowth,R.epsGrowth)]),
  health: s => s._bank ? null : avg([lin(s.debtEquity,R.debtEquity), lin(s.currentRatio,R.currentRatio)]),
  value:  s => { const pe = isNum(s.pe) ? lin(s.pe,R.pe) : (isNum(s.profitMargin) && s.profitMargin<0 ? 0 : null);
                 return avg([pe, lin(s.fpe,R.fpe), lin(s.pb,R.pb)]); },
  cash:   s => s._bank ? null : lin(s.fcfMargin,R.fcfMargin),   /* 은행은 잉여현금흐름 비율이 의미가 없어 제외 */
  payout: s => (isNum(s.divYield)||isNum(s.buybackYield)) ? lin((s.divYield||0)+(s.buybackYield||0),R.shareholderYield) : null,
  outlook:s => lin(s.upsidePct,R.upside),
  momentum:s => { const a = isNum(s.ma50)&&s.ma50>0 ? lin((s.price/s.ma50-1)*100,R.vsMa50):null;
                  const b = isNum(s.ma200)&&s.ma200>0 ? lin((s.price/s.ma200-1)*100,R.vsMa200):null;
                  let r = lin(s.rsi,R.rsi); if(r!==null && s.rsi>70) r=0.6;   /* 과열 구간은 감점 */
                  return avg([a,b,r,lin(s.chg52w,R.chg52w)]); },
  volume: s => (isNum(s.volume)&&isNum(s.avgVol20)&&s.avgVol20>0) ? lin(s.volume/s.avgVol20,R.volRatio) : null,
  market: (s,ctx) => ctx && isNum(ctx.marketScore) ? ctx.marketScore : null,
  divyield:s => lin(s.divYield,R.divYield),
  paysafe: s => lin(s.payout,R.payout),
  lowvol:  s => lin(s.beta,R.beta)
};

/* 가중치 → 정수 배점(합계 100) → 정수 득점. 합계는 항상 각 항목 득점의 합과 같습니다. */
function scoreWith(weights, s, ctx, minCov){
  const avail=[], missing=[];
  for(const k of Object.keys(weights)){ const sub=FACTOR_CALC[k](s,ctx); if(sub===null) missing.push(k); else avail.push({k,w:weights[k],sub}); }
  const cov = avail.reduce((p,c)=>p+c.w,0);
  if(cov < minCov) return { excluded:true, missing, coverage:cov };
  let used=0;
  avail.forEach(a=>{ const raw=a.w*100/cov; a.max=Math.floor(raw); a.frac=raw-a.max; used+=a.max; });
  [...avail].sort((x,y)=>y.frac-x.frac).slice(0,100-used).forEach(a=>{ a.max+=1; });
  let total=0, raw=0;
  avail.forEach(a=>{ a.pts=Math.round(a.max*a.sub); total+=a.pts; raw+=a.w*a.sub/cov*100; delete a.frac; });
  return { excluded:false, total, raw, parts:avail, missing, coverage:cov };
}
function scoreStock(s, hz, ctx){ return scoreWith(CONFIG.WEIGHTS[hz], s, ctx, CONFIG.MIN_COVERAGE); }
function lensScore(s, lens){ return scoreWith(CONFIG.LENS[lens], s, null, 60); }
function stars(score){ return score>=80?5: score>=65?4: score>=50?3: score>=35?2:1; }
function outlookOf(score){ return score>=65? "good" : score>=45? "mid" : "warn"; }

/* 시장 분위기: 신호별로 +1(긍정) / 0(중립) / -1(주의)을 매겨 합산합니다. */
function marketMood(mk, m){
  const sig=[]; const add=(name,val,v,why)=>sig.push({name,val,v,why});
  const idx = mk==="kr" ? m.kospi : m.sp500, idxName = mk==="kr" ? "코스피" : "S&P 500";
  if(idx && isNum(idx.monthPct)) add(idxName+" 최근 1개월", fmtSigned(idx.monthPct)+"%", idx.monthPct>=2?1: idx.monthPct<=-2?-1:0, "한 달 동안 2% 넘게 오르면 긍정, 2% 넘게 내리면 주의로 봅니다.");
  if(idx && isNum(idx.dayPct)) add(idxName+" 최근 거래일", fmtSigned(idx.dayPct)+"%", idx.dayPct>=0.5?1: idx.dayPct<=-0.5?-1:0, "하루 0.5% 넘게 오르면 긍정, 0.5% 넘게 내리면 주의로 봅니다.");
  if(m.vix && isNum(m.vix.value)) add("변동성 지수(VIX)", String(m.vix.value), m.vix.value<18?1: m.vix.value>25?-1:0, "시장의 불안 정도를 나타냅니다. 18보다 낮으면 안정, 25보다 높으면 불안으로 봅니다.");
  if(m.us10y && isNum(m.us10y.monthChgPp)) add("미국 10년 국채금리", m.us10y.value+"% (1개월 "+fmtSigned(m.us10y.monthChgPp)+"%p)", m.us10y.monthChgPp<=-0.15?1: m.us10y.monthChgPp>=0.15?-1:0, "금리가 빠르게 오르면 주식에 부담이 됩니다. 한 달 0.15%p 넘게 오르면 주의로 봅니다.");
  if(mk==="kr" && m.usdkrw && isNum(m.usdkrw.monthPct)) add("원/달러 환율 최근 1개월", fmtSigned(m.usdkrw.monthPct)+"%", m.usdkrw.monthPct<=-1?1: m.usdkrw.monthPct>=1?-1:0, "환율이 내리면(원화 강세) 외국인 자금이 들어오기 쉬워 긍정으로 봅니다.");
  if(!sig.length) return null;
  const sum=sig.reduce((p,c)=>p+c.v,0);
  return { key: sum>=2?"good": sum<=-2?"warn":"mid", sum, n:sig.length, score:(sum+sig.length)/(2*sig.length), signals:sig, date: idx? idx.date : null };
}
function fmtSigned(n){ return (n>0?"+":"")+n; }

/* 순위: 제외 종목을 빼고 점수(반올림 전 값) 높은 순. */
function rank(stocks, hz, ctx, band){
  const inBand = stocks.filter(s=> isNum(s.price) && s.price>band[2] && s.price<=band[3] || (band[0]==="all" && isNum(s.price)));
  const scored = inBand.map(s=>({s, r:scoreStock(s,hz,ctx)}));
  const ok = scored.filter(x=>!x.r.excluded).sort((a,b)=> b.r.total-a.r.total || b.r.raw-a.r.raw);
  return { ok, excluded: scored.filter(x=>x.r.excluded) };
}

    case "health": return j([isNum(s.debtEquity)&&"자본 대비 부채 "+num(s.debtEquity)+"배", isNum(s.currentRatio)&&"유동비율 "+num(s.currentRatio)+"배"])+"로 재무가 "+level(sub,"튼튼한 편입니다.","보통입니다.","부담이 있는 편입니다.");
    case "value": return j([isNum(s.pe)?"PER "+num(s.pe,1)+"배":(isNum(s.profitMargin)&&s.profitMargin<0?"최근 1년 적자로 PER 계산 불가":null), isNum(s.fpe)&&"예상 PER "+num(s.fpe,1)+"배", isNum(s.pb)&&"PBR "+num(s.pb)+"배"])+"로 가격 부담이 "+level(sub,"낮은 편입니다.","보통입니다.","높은 편입니다.");
    case "cash": return "매출 대비 잉여현금흐름이 "+num(s.fcfMargin,1)+"%로 현금 창출이 "+level(sub,"좋은 편입니다.","보통입니다.","약한 편입니다.");
    case "payout": return j([isNum(s.divYield)?"배당수익률 "+num(s.divYield)+"%":"배당 정보 없음", isNum(s.buybackYield)&&"자사주 매입 효과 "+sign(s.buybackYield,2)+"%"])+"로 주주환원이 "+level(sub,"많은 편입니다.","보통입니다.","적은 편입니다.");
    case "outlook": return "증권사 평균 목표주가가 현재가보다 "+Math.abs(s.upsidePct).toFixed(1)+"% "+(s.upsidePct>=0?"높습니다.":"낮습니다.")+" (예상치이며 보장되지 않습니다)";
    case "momentum": { const a=isNum(s.ma50)&&s.ma50>0?(s.price/s.ma50-1)*100:null, b=isNum(s.ma200)&&s.ma200>0?(s.price/s.ma200-1)*100:null;
      return j([a!==null&&"50일 평균 대비 "+sign(a)+"%", b!==null&&"200일 평균 대비 "+sign(b)+"%", isNum(s.rsi)&&"RSI "+num(s.rsi,1)])+"로 최근 흐름이 "+level(sub,"강한 편입니다.","보통입니다.","약한 편입니다."); }
    case "volume": return "최근 거래일 거래량이 20일 평균의 "+(s.volume/s.avgVol20).toFixed(2)+"배입니다.";
    case "market": return "현재 시장 분위기는 '"+(ctx&&ctx.mood? MOOD[ctx.mood.key][1] : NA)+"'입니다.";
    case "divyield": return "배당수익률 "+num(s.divYield)+"%";
    case "paysafe": return "이익 중 배당으로 나가는 비율 "+num(s.payout,1)+"%";
    case "lowvol": return "베타 "+num(s.beta);
  }
  return "";
}
function cautions(s){
  const c=[];
  if(isNum(s.rsi)&&s.rsi>70) c.push("RSI "+num(s.rsi,1)+"로 단기 과열 구간입니다. 단기 변동성에 주의하세요.");
  if(isNum(s.pe)&&s.pe>40) c.push("PER "+num(s.pe,1)+"배로 이익에 비해 주가가 높은 편입니다.");
  if(!isNum(s.pe)&&isNum(s.profitMargin)&&s.profitMargin<0) c.push("최근 1년 기준 적자입니다(순이익률 "+num(s.profitMargin,1)+"%).");
  if(isNum(s.epsGrowth)&&s.epsGrowth<0) c.push("주당순이익이 1년 전보다 "+Math.abs(s.epsGrowth).toFixed(1)+"% 줄었습니다.");
  if(isNum(s.debtEquity)&&s.debtEquity>1.5) c.push("자본 대비 부채가 "+num(s.debtEquity)+"배로 높은 편입니다.");
  if(isNum(s.beta)&&s.beta>1.5) c.push("베타 "+num(s.beta)+"로 시장보다 주가가 크게 출렁이는 편입니다.");
  if(isNum(s.payout)&&s.payout>100) c.push("이익보다 배당을 더 많이 주고 있어(배당성향 "+num(s.payout,1)+"%) 배당이 줄어들 수 있습니다.");
  if(isNum(s.ma200)&&s.ma200>0&&s.price<s.ma200*0.9) c.push("주가가 200일 평균보다 "+Math.abs((s.price/s.ma200-1)*100).toFixed(1)+"% 낮아 하락 흐름입니다.");
  if(s.nextEarnings){ const d=(new Date(s.nextEarnings)-new Date(state.data.generatedAt))/864e5; if(d>=-1&&d<=21) c.push("실적 발표 예정일("+dateK(s.nextEarnings)+")이 가까워 발표 전후로 주가가 크게 움직일 수 있습니다."); }
  return c;
}

    why.push("<b>정책</b><br>"+esc(sec.neg));
    body+='<div class="card"><div class="row" style="justify-content:space-between"><div><div class="sub small">'+HZ_NAME[state.hz]+' 종합점수</div><div class="big-score">'+r.total+' <span style="font-size:22px" class="sub">/ 100</span></div></div><div>'+starsHtml(stars(r.total))+"</div></div>"+
      '<button class="btn ghost wide" type="button" data-toggle="bd" aria-expanded="false">점수 상세 보기</button><div id="bd" hidden>'+breakdownHtml(r,s,ctx)+"</div></div>"+
      '<div class="card"><h3 class="sec-title">왜 관심 종목인가요?</h3><ol class="why">'+why.map((t,i)=>'<li><span class="no">'+(i+1)+"</span><span>"+t+"</span></li>").join("")+"</ol></div>"+
      '<div class="card"><h3 class="sec-title">좋은 점</h3><ul class="pts">'+(goods.length?goods.map(p=>'<li><span class="ok">✓</span><span>'+esc(factorText(p.k,s,p.sub,ctx))+"</span></li>").join(""):'<li><span class="ok">–</span><span>현재 기준으로 뚜렷한 강점 항목이 없습니다.</span></li>')+"</ul>"+
      '<h3 class="sec-title" style="padding-top:8px">주의할 점</h3><ul class="pts">'+(caut.length?caut.slice(0,4).map(t=>'<li><span class="no-ok">⚠</span><span>'+esc(t)+"</span></li>").join(""):'<li><span class="no-ok">⚠</span><span>뚜렷하게 약한 항목은 없지만, 주가는 언제든 내릴 수 있습니다.</span></li>')+"</ul></div>";
  }
  body+='<div class="card"><h3 class="sec-title">기간별 전망</h3>'+["short","mid","long"].map(h=>{ const x=R3[h];
      if(x.excluded) return '<div class="hz"><b>'+HZ_NAME[h]+' 전망</b><span class="sub">분석 데이터 부족</span></div>';
      const best=[...x.parts].sort((a,b)=>b.sub-a.sub)[0], worst=[...x.parts].sort((a,b)=>a.sub-b.sub)[0];
      return '<div class="hz"><b>'+HZ_NAME[h]+' 전망</b><span class="row">'+tagHtml(outlookOf(x.total))+" "+starsHtml(stars(x.total))+' <span class="num sub small">'+x.total+"점</span></span><p>가장 강한 항목은 "+FACTOR_NAME[best.k]+", 가장 약한 항목은 "+FACTOR_NAME[worst.k]+"입니다. "+esc(factorText(worst.k,s,worst.sub,ctx))+"</p></div>"; }).join("")+
    '<p class="small sub">전망 표시는 점수 구간에 따른 것입니다(65점 이상 긍정, 45~64점 중립, 44점 이하 주의). 미래 주가를 예측하는 것이 아닙니다.</p></div>';
  const LN={value:"가치투자 관점",growth:"성장투자 관점",dividend:"배당 관점",stable:"안정성 관점"};
  body+='<div class="card"><h3 class="sec-title">여러 관점에서 보기</h3><div class="lens">'+Object.keys(LN).map(k=>{ const x=lensScore(s,k);
      const noDiv = k==="dividend" && !isNum(s.divYield);
      return "<div><div class=\"small\"><b>"+LN[k]+"</b></div>"+(x.excluded||noDiv? '<div class="sub">'+(noDiv?"배당 정보 없음":"데이터 부족")+"</div>" : '<div class="n">'+x.total+'<span class="sub" style="font-size:16px"> 점</span></div><div class="sub" style="font-size:15px">'+x.parts.map(p=>FACTOR_NAME[p.k]+" "+p.pts+"/"+p.max).join(" · ")+"</div>")+"</div>"; }).join("")+"</div>"+
    '<div style="border-top:1px solid var(--line);padding-top:12px"><div class="row"><b>정책 영향</b><span class="tag '+(sec.sens==="높음"?"warn":sec.sens==="중간"?"mid":"good")+'">정책 민감도 '+sec.sens+"</span></div>"+
    '<ul class="pts" style="padding-top:8px"><li><span class="ok">＋</span><span><b>긍정적 요인</b> '+esc(sec.pos)+'</span></li><li><span class="no-ok">－</span><span><b>부정적 요인</b> '+esc(sec.neg)+"</span></li></ul>"+
    '<p class="small sub" style="padding-top:6px">'+sec.n+" 업종의 일반적인 설명입니다. 점수로 환산하지 않았고, 실제 정책 변화는 아래 뉴스와 공식 발표로 확인하세요.</p></div></div>";
  body+='<div class="card"><h3 class="sec-title">주요 숫자</h3>'+
    kvHtml("pe", isNum(s.pe)?num(s.pe,1)+"배":null)+kvHtml("fpe", isNum(s.fpe)?num(s.fpe,1)+"배":null)+kvHtml("pb", isNum(s.pb)?num(s.pb)+"배":null)+
    kvHtml("roe", isNum(s.roe)?num(s.roe,1)+"%":null)+kvHtml("opMargin", isNum(s.opMargin)?num(s.opMargin,1)+"%":null)+
    kvHtml("revGrowth", isNum(s.revGrowth)?sign(s.revGrowth)+"%":null)+kvHtml("epsGrowth", isNum(s.epsGrowth)?sign(s.epsGrowth)+"%":null)+
    kvHtml("debtEquity", isNum(s.debtEquity)?num(s.debtEquity)+"배":null)+kvHtml("fcfMargin", isNum(s.fcfMargin)?num(s.fcfMargin,1)+"%":null)+
    kvHtml("divYield", isNum(s.divYield)?num(s.divYield)+"%":null)+kvHtml("rsi", num(s.rsi,1))+kvHtml("beta", num(s.beta))+
    kvHtml("target", isNum(s.target)? (s.market==="kr"?"₩"+fmtInt(s.target):"$"+s.target.toFixed(2)) : null)+
    (s.nextEarnings? '<div class="kv"><b>다음 실적 발표 예정일</b><span class="v">'+dateK(s.nextEarnings)+"</span></div>":"")+"</div>";
  const news=(s.news||[]).slice(0,CONFIG.NEWS_MAX);
  body+='<div class="card"><h3 class="sec-title">최근 주요 뉴스</h3>'+(news.length? news.map(n=>'<div class="news"><a href="'+esc(n.url)+'" target="_blank" rel="noopener">'+esc(n.t)+'</a><span class="sub small">'+dateK(n.date)+" · "+esc(n.src)+"</span></div>").join("")+'<p class="small sub">해외 기사 제목을 우리말로 옮긴 것입니다. 자세한 내용은 원문에서 확인하세요.</p>' : '<p class="sub">최근 2주 안에 확인된 주요 뉴스가 없습니다.</p>')+"</div>";
  const src=s.market==="kr"?"https://stockanalysis.com/quote/krx/"+s.id+"/":"https://stockanalysis.com/stocks/"+s.id.toLowerCase()+"/";
  body+='<div class="foot"><p><b>데이터 기준일</b> '+dateK(s.priceDate)+" (주가) · 재무 지표는 최근 12개월 기준</p><p><b>출처</b> <a href=\""+src+'" target="_blank" rel="noopener">'+esc(state.data.sources.stocks.name)+" – "+esc(u.name)+"</a></p><p>분석 결과는 투자 권유가 아니며 수익을 보장하지 않습니다.</p></div>";
  sh.innerHTML=bar+'<div class="sheet-body">'+body+"</div>"; show();
  function show(){ sh.hidden=false; sh.scrollTop=0; document.body.style.overflow="hidden"; }
}
function closeDetail(){ $("sheet").hidden=true; state.openId=null; document.body.style.overflow=""; }
let toastT; function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{t.hidden=true;},3200); }

function renderAll(){ renderHeader(); renderTabs(); renderMood(); renderFilter(); renderTop(); renderSearch(); renderWatch(); renderAlgo(); renderFoot(); if(state.openId) openDetail(state.openId); }
function applyData(d){ state.data=d; state.byId={}; (d.stocks||[]).forEach(s=>{ const u=UNIVERSE.find(v=>v.id===s.id); if(!u) return; s.market=u.market; s._bank=u.sec==="bank"; state.byId[s.id]=s; }); }

async function load(isRefresh){
  const btn=$("btnRefresh"); btn.disabled=true; btn.textContent="불러오는 중…";
  try{
    const res=await fetch("data.json",{cache:"no-store"}); if(!res.ok) throw new Error("HTTP "+res.status);
    const d=await res.json(); if(!d||!Array.isArray(d.stocks)||!d.generatedAt||!d.market) throw new Error("형식 오류");
    const prev=state.data&&state.data.generatedAt; applyData(d); renderAll();
    if(isRefresh) toast(prev===d.generatedAt? "이미 가장 최근 데이터입니다. 장이 열린 날 약 3시간마다 새로 갱신됩니다." : "새 데이터로 바꿨습니다.");
  }catch(e){
    if(!state.data){ $("upd").textContent="데이터를 불러오지 못했습니다.";
      $("banners").innerHTML='<div class="banner err"><b>데이터 연결 필요</b><br>현재 최신 주가 데이터를 불러올 수 없습니다. 데이터 연결 후 추천 기능을 사용할 수 있습니다. 잠시 뒤 새로고침을 눌러 주세요.</div>';
      ["mood","filter","top5","watch","algo","foot"].forEach(id=>{ $(id).innerHTML=""; }); }
    else toast("새 데이터를 불러오지 못했습니다. 이전 데이터를 그대로 보여드립니다.");
  }finally{ btn.disabled=false; btn.textContent="새로고침"; }
}

document.addEventListener("click", e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.market){ state.market=t.dataset.market; state.band="all"; lsSet("sa_market",state.market); renderTabs(); renderMood(); renderFilter(); renderTop(); }
  else if(t.dataset.hz){ state.hz=t.dataset.hz; lsSet("sa_hz",state.hz); renderTabs(); renderTop(); }
  else if(t.dataset.band){ state.band=t.dataset.band; renderFilter(); renderTop(); }
  else if(t.dataset.open){ openDetail(t.dataset.open); }
  else if(t.hasAttribute("data-close")){ closeDetail(); }
  else if(t.dataset.watch){ const id=t.dataset.watch, i=state.watch.indexOf(id); if(i>=0) state.watch.splice(i,1); else state.watch.push(id); lsSet("sa_watch",state.watch); renderWatch(); openDetailKeepScroll(id); toast(i>=0?"관심종목에서 뺐습니다.":"관심종목에 추가했습니다."); }
  else if(t.dataset.toggle){ tog(t,$(t.dataset.toggle),"점수 상세 보기","점수 상세 닫기"); }
  else if(t.id==="btnWhy"){ tog(t,$("whyBox"),"왜 이렇게 판단했나요?","설명 닫기"); }
  else if(t.id==="btnAlgo"){ tog(t,$("algoBox"),"계산 방법 보기","계산 방법 닫기"); }
  else if(t.dataset.fs){ state.fs=parseFloat(t.dataset.fs); lsSet("sa_fs",state.fs); applyFs(); }
  else if(t.id==="btnRefresh"){ load(true); }
});
function applyFs(){ document.body.style.zoom=String(state.fs); document.querySelectorAll("[data-fs]").forEach(b=>b.setAttribute("aria-pressed", String(parseFloat(b.dataset.fs)===state.fs))); }
function tog(btn,box,a,b){ box.hidden=!box.hidden; btn.setAttribute("aria-expanded",String(!box.hidden)); btn.textContent=box.hidden?a:b; }
function openDetailKeepScroll(id){ const y=$("sheet").scrollTop; openDetail(id); $("sheet").scrollTop=y; }
document.addEventListener("change", e=>{ if(e.target.id==="krw"){ state.krw=e.target.checked; lsSet("sa_krw",state.krw); renderTop(); } });
$("q").addEventListener("input", renderSearch);
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("sheet").hidden) closeDetail(); });

state.market=lsGet("sa_market","kr")==="us"?"us":"kr";
state.hz=["short","mid","long"].includes(lsGet("sa_hz","long"))?lsGet("sa_hz","long"):"long";
state.krw=lsGet("sa_krw",true)!==false;
const w=lsGet("sa_watch",[]); state.watch=Array.isArray(w)?w.filter(x=>typeof x==="string"):[];
state.fs=[1,1.15,1.3].includes(lsGet("sa_fs",1))?lsGet("sa_fs",1):1; applyFs();
renderTabs(); load(false);
</script>

</body>
</html>
