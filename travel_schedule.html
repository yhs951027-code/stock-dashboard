<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>괴산 시간별 일정</title>
<style>
:root{
  --bg:#f6f4ee; --card:#ffffff; --ink:#1f2a24; --sub:#5c665f; --line:#e3e0d6;
  --brand:#2f6b4f; --brand-soft:#e4efe8; --accent:#d9a521; --accent-soft:#fbf1d6;
  --ok:#2f7d4f; --ok-soft:#e1f2e7; --warn:#a86a00; --warn-soft:#fdf0d5; --no:#b23b3b; --no-soft:#f9e1e1;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151a17; --card:#1f2622; --ink:#e8ece9; --sub:#a3ada6; --line:#323b36;
    --brand:#7cc29f; --brand-soft:#23342b; --accent:#e8bd4a; --accent-soft:#3a3220;
    --ok:#7fd3a0; --ok-soft:#1f3a2a; --warn:#f0c060; --warn-soft:#3d321c; --no:#f08c8c; --no-soft:#402424;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151a17; --card:#1f2622; --ink:#e8ece9; --sub:#a3ada6; --line:#323b36;
  --brand:#7cc29f; --brand-soft:#23342b; --accent:#e8bd4a; --accent-soft:#3a3220;
  --ok:#7fd3a0; --ok-soft:#1f3a2a; --warn:#f0c060; --warn-soft:#3d321c; --no:#f08c8c; --no-soft:#402424;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--brand)}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* hero */
.hero{position:relative;overflow:hidden;background:#cfe3d6}
.hero svg{display:block;width:100%;height:300px}
.hero-txt{position:absolute;left:0;right:0;bottom:0;padding:24px 0 22px;background:linear-gradient(transparent,rgba(10,25,18,.72));color:#fff}
.hero-txt h1{margin:0;font-size:clamp(24px,5vw,38px);line-height:1.25;letter-spacing:-.5px}
.hero-txt p{margin:6px 0 0;font-size:15px;opacity:.95}
.illu-tag{position:absolute;top:10px;right:12px;font-size:12px;background:rgba(0,0,0,.45);color:#fff;padding:3px 8px;border-radius:20px}

/* nav */
nav.menu{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
nav.menu .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:8px;padding-bottom:8px}
nav.menu .wrap::-webkit-scrollbar{display:none}
nav.menu button{flex:0 0 auto;border:0;background:none;padding:8px 12px;border-radius:20px;cursor:pointer;font-size:15px;color:var(--sub);white-space:nowrap}
nav.menu button[aria-selected="true"]{background:var(--brand);color:#fff;font-weight:600}
:root[data-theme="dark"] nav.menu button[aria-selected="true"]{color:#10231a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.menu button[aria-selected="true"]{color:#10231a}}

main{padding:20px 0 60px}
section.panel{display:none}
section.panel.active{display:block}
h2{font-size:22px;margin:4px 0 12px;letter-spacing:-.3px}
h3{font-size:18px;margin:0 0 6px}
.lead{color:var(--sub);margin:0 0 16px}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.notice{background:var(--accent-soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;margin:0 0 16px}
.muted{color:var(--sub);font-size:14px}

/* summary */
.sum-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.stat .k{font-size:13px;color:var(--sub)}
.stat .v{font-size:20px;font-weight:700;margin-top:2px}
.stat .s{font-size:13px;color:var(--sub)}

/* badges */
.badge{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:20px;line-height:1.6}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-no{background:var(--no-soft);color:var(--no)}
.b-tag{background:var(--brand-soft);color:var(--brand)}
.need{color:var(--warn);font-weight:600}

/* day tabs & timeline */
.daytabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.daytabs button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 6px;cursor:pointer;text-align:center;line-height:1.3}
.daytabs button b{display:block;font-size:16px}
.daytabs button span{font-size:13px;color:var(--sub)}
.daytabs button[aria-selected="true"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.route{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.route ol{margin:6px 0 0;padding-left:22px}
.route li{margin:2px 0}
.timeline{position:relative;padding-left:22px}
.timeline:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.stop{position:relative;margin-bottom:12px}
.stop:before{content:"";position:absolute;left:-20px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--brand);border:2px solid var(--bg)}
.stop .time{font-weight:700;color:var(--brand);font-size:15px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:15px;margin:10px 0}
.kv dt{color:var(--sub)}
.kv dd{margin:0}
.move{font-size:14px;color:var(--sub);margin:-4px 0 12px;padding-left:2px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 11px;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#10231a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#10231a}}
.src{font-size:13px;color:var(--sub);margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.src a{word-break:break-all}

/* filter */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:14px}
.filters button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

.alert{background:var(--no-soft);color:var(--ink);border:1px solid var(--no);border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:15px}
.alert b:first-child{display:block;color:var(--no);margin-bottom:4px}
.alert .btn{margin-top:8px}
nav.menu a.navlink{flex:0 0 auto;padding:8px 12px;border-radius:20px;font-size:15px;color:var(--brand);white-space:nowrap;text-decoration:none;font-weight:600}
.rec{display:flex;flex-direction:column;gap:8px}
.rec .tag{align-self:flex-start}
.rec h3{margin:0}
.rec .alts{font-size:14px}
.rec .alts button{border:0;background:none;padding:0;color:var(--brand);text-decoration:underline;cursor:pointer;font-size:14px}
/* shop list */
.shop{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;box-shadow:var(--shadow)}
.shop summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.shop summary::-webkit-details-marker{display:none}
.shop summary:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:12px}
.shop .nm{font-weight:700;font-size:16px;min-width:0;flex:1 1 180px}
.shop .nm small{display:block;font-weight:400;color:var(--sub);font-size:13px}
.shop .days{display:flex;gap:4px;flex:0 0 auto}
.oc{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:20px;white-space:nowrap}
.oc.o{background:var(--ok-soft);color:var(--ok)} .oc.x{background:var(--no-soft);color:var(--no)} .oc.q{background:var(--line);color:var(--sub)}
.shop .chev{color:var(--sub);font-size:13px;flex:0 0 auto;transition:transform .15s}
.shop[open] .chev{transform:rotate(180deg)}
.shop .body{padding:0 14px 14px;border-top:1px dashed var(--line)}
.pricebox{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:12px 0 4px;font-size:15px}
.pricebox b{display:block;font-size:13px;color:var(--sub);font-weight:600}
@media (prefers-reduced-motion: reduce){.shop .chev{transition:none}}

/* directions */
.dir{display:grid;gap:8px;grid-template-columns:1fr 1fr auto;align-items:end}
.dir label{font-size:14px;color:var(--sub);display:block}
.dir input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}

/* budget */
.btable{width:100%;border-collapse:collapse}
.btable th,.btable td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:15px}
.btable th{font-size:13px;color:var(--sub);font-weight:600}
.btable input[type=number]{width:120px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:right}
.btable select{padding:7px 6px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.bnote{font-size:13px;color:var(--sub);margin-top:3px}
.bres{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin:16px 0}
.bres .stat .v{font-size:19px}
.over{color:var(--no)} .under{color:var(--ok)}
.inline-in{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:8px 0}
.inline-in input{width:140px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:right}

/* checklist */
.chk-group{margin-bottom:16px}
.chk-item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:6px;cursor:pointer}
.chk-item input{width:20px;height:20px;margin-top:2px;flex:0 0 auto;accent-color:var(--brand)}
.chk-item.done span{text-decoration:line-through;color:var(--sub)}
.progress{height:10px;border-radius:10px;background:var(--line);overflow:hidden;margin:6px 0 14px}
.progress div{height:100%;background:var(--brand);width:0;transition:width .2s}

.srctable{width:100%;border-collapse:collapse;font-size:14px}
.srctable th,.srctable td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.srctable a{word-break:break-all}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2a24;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:1}
footer{color:var(--sub);font-size:13px;padding:20px 0 40px;border-top:1px solid var(--line)}
.theme-btn{position:absolute;top:10px;left:12px;font-size:12px;background:rgba(0,0,0,.45);color:#fff;border:0;padding:3px 10px;border-radius:20px;cursor:pointer}

@media (max-width:640px){
  .hero svg{height:230px}
  .daytabs button b{font-size:15px}
  .kv{grid-template-columns:84px 1fr;font-size:14.5px}
  .dir{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .btable thead{display:none}
  .btable tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}
  .btable td{display:block;border:0;padding:3px 0}
  .btable input[type=number]{width:100%}
}

.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:8px}
.topbar h1{font-size:18px;margin:0}
.panel{display:block}
</style>
</head>

/* ---------- 유틸 ---------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function enc(s){return encodeURIComponent(s)}
function won(n){return Math.round(n).toLocaleString("ko-KR")+"원"}
function store(k,v){try{ if(v===undefined){return localStorage.getItem(k)} localStorage.setItem(k,v) }catch(e){return null}}
function storeDel(k){try{localStorage.removeItem(k)}catch(e){}}
var toastT;
// confirm() 대신 두 번 눌러 확인 (임베드 환경에서도 동작)
function armed(btn,label){
  if(btn.dataset.armed==="1"){ btn.dataset.armed=""; btn.textContent=btn.dataset.label; clearTimeout(btn._t); return true; }
  btn.dataset.label=btn.dataset.label||btn.textContent; btn.dataset.armed="1"; btn.textContent=label;
  clearTimeout(btn._t); btn._t=setTimeout(function(){btn.dataset.armed="";btn.textContent=btn.dataset.label},4000);
  return false;
}
function toast(msg){var t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show")},1800)}

// 지도 검색어: 주소의 괄호 설명은 빼고 사용
function q(p){ return p.addr.replace(/\s*\(.*?\)\s*/g," ").replace(/ 일대$/,"").trim() }
function naverUrl(s){return "https://map.naver.com/p/search/"+enc(s)}
function kakaoUrl(s){return "https://map.kakao.com/?q="+enc(s)}
function kakaoRoute(a,b){return "https://map.kakao.com/?sName="+enc(a)+"&eName="+enc(b)}

function dogBadge(n){
  if(n===1) return '<span class="badge b-ok">두 마리 확인 완료</span>';
  if(n===3) return '<span class="badge b-no">동반 불가·조건 불충족</span>';
  return '<span class="badge b-warn">추가 확인 필요</span>';
}
function srcHtml(ids){
  return '<div class="src">출처 (확인일 '+CHECKED+'): '+ids.map(function(id){var s=SRC[id];return '<a href="'+s.u+'" target="_blank" rel="noopener">'+esc(s.t)+'</a>'}).join(" · ")+'</div>';
}
function mapBtns(p){
  var s=q(p);
  return '<a class="btn" href="'+naverUrl(s)+'" target="_blank" rel="noopener">네이버 지도</a>'+
         '<a class="btn" href="'+kakaoUrl(s)+'" target="_blank" rel="noopener">카카오맵</a>'+
         '<button class="btn" type="button" data-copy="'+esc(p.addr)+'">주소 복사</button>';
}

/* ---------- 일정 ---------- */
var curDay=0;
function renderDayTabs(){
  $("#daytabs").innerHTML=DAYS.map(function(d,i){
    return '<button role="tab" type="button" data-day="'+i+'" aria-selected="'+(i===curDay)+'"><b>'+d.d+' ('+d.w+')</b><span>'+(i+1)+'일차</span></button>';
  }).join("");
}
function stopInfo(s){
  if(s.p){var p=P[s.p];return {name:p.name,addr:p.addr,dog:p.dog,dogText:p.dogText,src:p.src,obj:p}}
  return {name:s.place,addr:s.addr,dog:0,dogText:"-",src:[],obj:null};
}
function renderDay(){
  var d=DAYS[curDay];
  var names=d.stops.map(function(s){return stopInfo(s).name});
  $("#dayroute").innerHTML='<b>'+esc(d.title)+'</b><ol>'+d.stops.map(function(s,i){return '<li>'+s.t+' · '+esc(names[i])+'</li>'}).join("")+'</ol>';
  $("#daylist").innerHTML=d.stops.map(function(s,i){
    var info=stopInfo(s), nxt=d.stops[i+1], nInfo=nxt?stopInfo(nxt):null;
    var move="";
    if(nInfo && nInfo.obj && info.obj){
      if(nInfo.addr===info.addr){ move='<div class="move">↓ 다음 장소: 같은 장소</div>'; }
      else move='<div class="move">↓ 다음 장소까지 이동 시간: <span class="need">미측정</span> · <a href="'+kakaoRoute(q(info.obj),q(nInfo.obj))+'" target="_blank" rel="noopener">카카오맵 길찾기로 확인</a></div>';
    }
    var dogRow = info.obj ? dogBadge(info.dog)+'<div class="muted" style="margin-top:4px">'+esc(info.dogText)+'</div>' : '-';
    var btns = info.obj ? '<div class="btns">'+mapBtns(info.obj)+'</div>' : '';
    return '<div class="stop"><div class="card">'+
      '<div class="time">'+s.t+'</div><h3>'+esc(info.name)+'</h3>'+
      '<dl class="kv">'+
        '<dt>주소</dt><dd>'+esc(info.addr)+'</dd>'+
        '<dt>체류 시간</dt><dd>'+esc(s.stay)+' (예상)</dd>'+
        '<dt>추천 이유</dt><dd>'+esc(s.why)+'</dd>'+
        '<dt>예상 비용</dt><dd>'+s.cost+'</dd>'+
        '<dt>반려견</dt><dd>'+dogRow+'</dd>'+
        '<dt>주의사항</dt><dd>'+esc(s.note)+'</dd>'+
      '</dl>'+btns+(info.src.length?srcHtml(info.src):'')+
    '</div></div>'+move;
  }).join("");
}
$("#daytabs").addEventListener("click",function(e){
  var b=e.target.closest("button[data-day]"); if(!b) return;
  curDay=+b.getAttribute("data-day"); renderDayTabs(); renderDay();
});

/* ---------- 주소 복사 ---------- */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-copy]"); if(!b) return;
  var text=b.getAttribute("data-copy"), what=b.getAttribute("data-what")||"주소";
  function fallback(){
    var ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(err){}
    document.body.removeChild(ta);toast(ok?what+"를 복사했어":"복사 실패 — 길게 눌러 복사해줘");
  }
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(function(){toast(what+"를 복사했어")},fallback)}
  else fallback();
});

/* ---------- 단톡방 시간표 ---------- */
function shareText(){
  var lines=["[괴산 스테이소몽 2박 3일 시간표] 10/30(금)–11/1(일) · 6명 + 반려견 2마리",""];
  DAYS.forEach(function(d){
    lines.push("■ "+d.d+"("+d.w+") "+d.title.replace(/^\d일차 · /,""));
    d.stops.forEach(function(s){ lines.push("  "+s.t+" "+stopInfo(s).name); });
  });
  lines.push("","숙소: 충북 괴산군 청천면 괴산로상신2길 52-9 (소몽 객실 · 체크인 15:00 / 체크아웃 11:00)");
  lines.push("※ 소몽 객실: 애견동반 가능 · 수영장 이용 불가");
  return lines.join("\n");
}
$("#shareCopy").addEventListener("click",function(){
  var text=shareText();
  function fb(){var ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(ta);toast(ok?"시간표를 복사했어":"복사 실패 — 다시 눌러줘");}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(function(){toast("시간표를 복사했어")},fb)} else fb();
});
/* ---------- 테마 ---------- */
var TKEY="goesan_theme";
function applyTheme(t){ if(t) document.documentElement.setAttribute("data-theme",t); else document.documentElement.removeAttribute("data-theme"); }
applyTheme(store(TKEY));
$("#themeBtn").addEventListener("click",function(){
  var cur=document.documentElement.getAttribute("data-theme");
  var sysDark=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches;
  var isDark=cur?cur==="dark":sysDark; var next=isDark?"light":"dark";
  applyTheme(next); store(TKEY,next); toast(next==="dark"?"어두운 화면":"밝은 화면");
});

renderDayTabs(); renderDay();
})();
